name: Retire shared-host application endpoints
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-backend
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTING_CONFIGURED: ${{ secrets.CPANEL_USER != '' && secrets.CPANEL_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Validate retired entry points
        run: |
          php -l index.php
          php -l share.php
          php -l bin/purge-deleted-recipes.php
          php tests/data_routes.php
      - run: python3 -m pip install requests==2.32.5
      - name: Validate retirement and media transfer tools without hosting access
        run: |
          python3 -m unittest discover -s tool -p 'test_deploy_backend.py'
          python3 -m unittest discover -s tool -p 'test_move_recipe_media.py'
          python3 -m unittest discover -s tool -p 'test_recipe_cleanup_schedule.py'
      - name: Retire application endpoints
        if: env.HOSTING_CONFIGURED == 'true'
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python3 tool/deploy-backend.py
